name: Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the course engine and build the app
        run: ./gradlew :engine:test :app:assembleDebug
      - name: Name the APK
        run: mv app/build/outputs/apk/debug/app-debug.apk PolishEasy-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PolishEasy-debug
          path: PolishEasy-debug.apk
          if-no-files-found: error
      - name: Publish the APK as the "latest" release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest PolishEasy-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build (#$GITHUB_RUN_NUMBER)" \
            --notes "Debug APK built from $GITHUB_SHA. Replaced on every update to the default branch."
