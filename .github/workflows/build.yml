name: Build

# Keep the release build in this file: versionCode is this workflow's run number, and
# Google Play only accepts uploads with a higher versionCode than the last one.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The upload key is only used on the default branch. Everywhere else, and while
      # the secrets are not set, the release build is compiled and minified but unsigned.
      SIGN_RELEASE: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode the upload keystore
        if: env.SIGN_RELEASE == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
      - name: Test the course engine and build the app
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :engine:test :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Name the APK
        run: mv app/build/outputs/apk/debug/app-debug.apk PolishEasy-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PolishEasy-debug
          path: PolishEasy-debug.apk
          if-no-files-found: error
      - name: Name the signed release files
        if: env.SIGN_RELEASE == 'true'
        run: |
          mv app/build/outputs/apk/release/app-release.apk PolishEasy-release.apk
          mv app/build/outputs/bundle/release/app-release.aab PolishEasy-release.aab
          mv app/build/outputs/mapping/release/mapping.txt PolishEasy-release-mapping.txt
      - name: Check the release signatures
        if: env.SIGN_RELEASE == 'true'
        run: |
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs PolishEasy-release.apk
          jarsigner -verify PolishEasy-release.aab | tee aab-verify.txt
          grep -q "jar verified" aab-verify.txt
      - uses: actions/upload-artifact@v4
        if: env.SIGN_RELEASE == 'true'
        with:
          name: PolishEasy-release
          path: |
            PolishEasy-release.apk
            PolishEasy-release.aab
            PolishEasy-release-mapping.txt
          if-no-files-found: error
      - name: Publish the builds as the "latest" release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(PolishEasy-debug.apk)
          notes="Built from $GITHUB_SHA. Replaced on every update to the default branch. PolishEasy-debug.apk is the debug build."
          if [ "$SIGN_RELEASE" = "true" ]; then
            files+=(PolishEasy-release.apk PolishEasy-release.aab PolishEasy-release-mapping.txt)
            notes="$notes PolishEasy-release.aab is the signed bundle to upload to Google Play, PolishEasy-release.apk is the signed release build for installing directly, and PolishEasy-release-mapping.txt decodes crash stack traces."
          else
            notes="$notes No signed release files: the release signing secrets are not set (see docs/release.md)."
          fi
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "${files[@]}" \
            --target "$GITHUB_SHA" \
            --title "Latest build (#$GITHUB_RUN_NUMBER)" \
            --notes "$notes"
