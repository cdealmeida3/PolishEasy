name: Build

# Keep the release build in this file: versionCode is this workflow's run number, and
# Google Play only accepts uploads with a higher versionCode than the last one.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the course engine and the screens, check the Polish and build the app
        run: ./gradlew :engine:test :polishcheck:test :audio:test :app:testDebugUnitTest :polishcheck:checkPolish :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polish-check
          path: polishcheck/build/polish-check/
          if-no-files-found: ignore
      - name: Name the APK
        run: mv app/build/outputs/apk/debug/app-debug.apk PolishEasy-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PolishEasy-debug
          path: PolishEasy-debug.apk
          if-no-files-found: error
      - name: Name the signed release files
        run: |
          mv app/build/outputs/apk/release/app-release.apk PolishEasy-release.apk
          mv app/build/outputs/bundle/release/app-release.aab PolishEasy-release.aab
          mv app/build/outputs/mapping/release/mapping.txt PolishEasy-release-mapping.txt
      - name: Check the release signatures
        run: |
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs PolishEasy-release.apk
          jarsigner -verify PolishEasy-release.aab | tee aab-verify.txt
          grep -q "jar verified" aab-verify.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PolishEasy-release
          path: |
            PolishEasy-release.apk
            PolishEasy-release.aab
            PolishEasy-release-mapping.txt
          if-no-files-found: error
      - name: Publish the builds as the "latest" release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from $GITHUB_SHA. Replaced on every update to the default branch. PolishEasy-debug.apk is the debug build. PolishEasy-release.apk is the signed release build for installing directly, PolishEasy-release.aab is the signed bundle to upload to Google Play, and PolishEasy-release-mapping.txt decodes crash stack traces."
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest PolishEasy-debug.apk PolishEasy-release.apk PolishEasy-release.aab PolishEasy-release-mapping.txt \
            --target "$GITHUB_SHA" \
            --title "Latest build (#$GITHUB_RUN_NUMBER)" \
            --notes "$notes"
